name: Bootstrap Expo SDK 58 upgrade (temporary)

on:
  push:
    branches: [security/expo58-release-readiness]

permissions:
  contents: write

jobs:
  upgrade:
    if: contains(github.event.head_commit.message, '[sdk58-upgrade]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://tempo-api.invalid
      EXPO_PUBLIC_SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upgrade SDK 58 and align native packages
        run: |
          npx expo install expo@^58.0.0 --fix --npm
          npm install --save-dev @types/react@~19.3.0 babel-preset-expo@~58.0.0 eslint-config-expo@~58.0.4 --ignore-scripts --no-fund
          npx expo install --check
          npm audit --audit-level=high
          npm ci --ignore-scripts --no-fund
          npm ls expo expo-router react react-native --depth=0
      - name: Print upgraded package versions
        run: |
          npm ls expo expo-router react-native react --depth=0 || true
          npx expo install --check || true
      - name: Commit complete package and lock updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: align Expo SDK 58 dependencies"
            git push origin HEAD:security/expo58-release-readiness
          fi
